name: 'Terraform Init'
description: 'Installs Terraform, sets Azure service principal credentials from a JSON secret, and runs terraform init against the Azure backend'

inputs:
  terraform-version:
    description: 'Terraform version to install'
    required: false
    default: 'latest'
  backend-config-file:
    description: 'Path to the flat key=value backend config file (used with -backend-config)'
    required: false
    default: 'backend.conf'
  working-directory:
    description: 'Directory containing the Terraform files'
    required: false
    default: '.'
  azure-credentials:
    description: >
      JSON service principal credential:
      {"clientId": "...", "clientSecret": "...", "subscriptionId": "...", "tenantId": "..."}
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}


    - name: Set Azure credentials from JSON
      shell: bash
      run: |
        CREDS='${{ inputs.azure-credentials }}'
        CLIENT_ID=$(echo "$CREDS" | jq -r .clientId)
        CLIENT_SECRET=$(echo "$CREDS" | jq -r .clientSecret)
        SUBSCRIPTION_ID=$(echo "$CREDS" | jq -r .subscriptionId)
        TENANT_ID=$(echo "$CREDS" | jq -r .tenantId)

        # Register each derived value as a masked secret BEFORE it is ever
        # written anywhere else - jq-extracted substrings of a JSON secret
        # are NOT auto-masked by GitHub, only the exact original blob is.
        echo "::add-mask::$CLIENT_ID"
        echo "::add-mask::$CLIENT_SECRET"
        echo "::add-mask::$SUBSCRIPTION_ID"
        echo "::add-mask::$TENANT_ID"

        echo "ARM_CLIENT_ID=$CLIENT_ID"             >> "$GITHUB_ENV"
        echo "ARM_CLIENT_SECRET=$CLIENT_SECRET"     >> "$GITHUB_ENV"
        echo "ARM_SUBSCRIPTION_ID=$SUBSCRIPTION_ID" >> "$GITHUB_ENV"
        echo "ARM_TENANT_ID=$TENANT_ID"             >> "$GITHUB_ENV"

    - name: Terraform Init (Azure backend, service principal auth)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform init -input=false -backend-config="${{ inputs.backend-config-file }}"
