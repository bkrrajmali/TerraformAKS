name: 'Terraform Init'
description: 'Installs Terraform, sets Azure service principal credentials from a JSON secret, and runs terraform init against the Azure backend'

inputs:
  terraform-version:
    description: 'Terraform version to install'
    required: false
    default: 'latest'
  backend-config-file:
    description: 'Path to the flat key=value backend config file (used with -backend-config)'
    required: false
    default: 'backend.conf'
  working-directory:
    description: 'Directory containing the Terraform files'
    required: false
    default: '.'
  azure-credentials:
    description: >
      JSON service principal credential, same shape as azure/login's
      AZURE_CREDENTIALS secret:
      {"clientId": "...", "clientSecret": "...", "subscriptionId": "...", "tenantId": "..."}
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}

    # Parse the single JSON secret into the ARM_* env vars the azurerm
    # provider/backend read automatically. Exported to $GITHUB_ENV so every
    # later step in the calling job (plan/apply/destroy) also gets them -
    # this action only needs to be called once per job.
    - name: Set Azure credentials from JSON
      shell: bash
      run: |
        CREDS='${{ inputs.azure-credentials }}'
        echo "ARM_CLIENT_ID=$(echo "$CREDS" | jq -r .clientId)"             >> "$GITHUB_ENV"
        echo "ARM_CLIENT_SECRET=$(echo "$CREDS" | jq -r .clientSecret)"     >> "$GITHUB_ENV"
        echo "ARM_SUBSCRIPTION_ID=$(echo "$CREDS" | jq -r .subscriptionId)" >> "$GITHUB_ENV"
        echo "ARM_TENANT_ID=$(echo "$CREDS" | jq -r .tenantId)"             >> "$GITHUB_ENV"

    - name: Terraform Init (Azure backend, service principal auth)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform init -input=false -backend-config="${{ inputs.backend-config-file }}"
