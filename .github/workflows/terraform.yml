name: Terraform AKS Pipeline

# --- Triggers -----------------------------------------------------------
# - push to ANY branch except prod        -> validate + plan (no apply)
# - pull_request targeting prod           -> validate + plan (posts plan as PR check;
#                                             actual merge approval is enforced by the
#                                             prod branch protection rule, see README notes)
# - push to prod (i.e. after a PR merges) -> validate + plan + apply (apply gated by
#                                             the "prod" GitHub Environment's required
#                                             reviewers)
# - manual dispatch with destroy=true     -> validate + plan + destroy (also gated by
#                                             the "prod" GitHub Environment)
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      action:
        description: 'What to run against prod'
        type: choice
        options:
          - apply
          - destroy
        default: apply

permissions:
  contents: read
  pull-requests: write   # lets the plan job comment on the PR

# Prevent two runs from racing against the same state file.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_WORKING_DIR: '.'
  TF_BACKEND_CONFIG: 'backend.conf'

jobs:

  # --------------------------------------------------------------------
  # PLAN ONLY - every non-prod branch push, and every PR into prod.
  # --------------------------------------------------------------------
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref != 'refs/heads/prod')
    steps:
      - uses: actions/checkout@v4

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: true   # surfaces formatting drift without failing the build

      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          working-directory: ${{ env.TF_WORKING_DIR }}
          backend-config-file: ${{ env.TF_BACKEND_CONFIG }}
          azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -out=tfplan

  # --------------------------------------------------------------------
  # APPLY - push to prod, or manual dispatch with action=apply from prod.
  # --------------------------------------------------------------------
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/prod' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'))
    environment: prod   # approval gate - Settings > Environments > prod > Required reviewers
    steps:
      - uses: actions/checkout@v4

      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          working-directory: ${{ env.TF_WORKING_DIR }}
          backend-config-file: ${{ env.TF_BACKEND_CONFIG }}
          azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false tfplan

  # --------------------------------------------------------------------
  # DESTROY - manual dispatch with action=destroy from prod only.
  # --------------------------------------------------------------------
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/prod' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy'
    environment: prod   # independent approval gate for destroy
    steps:
      - uses: actions/checkout@v4

      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          working-directory: ${{ env.TF_WORKING_DIR }}
          backend-config-file: ${{ env.TF_BACKEND_CONFIG }}
          azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan (destroy)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -destroy -input=false -out=tfplan

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false tfplan
